  <link rel="stylesheet" href="css/all.min.css" />
</head>
<body>
  <script>
(function() {
  // ✨ فحص متزامن لحالة الحظر من الكاش أولاً (له الأولوية على الطرد)، يعمل
  // فورًا قبل رسم أي محتوى — يمنع الوميض. المصدر الحقيقي يبقى Firestore
  // عبر ban-guard.js الذي يعمل لاحقًا ويؤكد/يصحّح الحالة.
  try {
    var banRaw = localStorage.getItem('banGuardState');
    if (banRaw) {
      var banState = JSON.parse(banRaw);
      if (banState && banState.isBanned) {
        document.documentElement.style.overflow = 'hidden';

        var banStyle = document.createElement('style');
        banStyle.id = 'ban-screen-style';
        banStyle.textContent = '#banScreenOverlay{position:fixed;inset:0;background:#000;z-index:2147483647;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;}#banScreenOverlay .ban-screen-icon{width:96px;height:96px;margin-bottom:24px;}#banScreenOverlay .ban-screen-title{color:#fff;font-size:30px;font-weight:700;margin:0 0 12px;font-family:inherit;}#banScreenOverlay .ban-screen-subtitle{color:#9ca3af;font-size:16px;margin:0;font-family:inherit;direction:rtl;}';
        document.head.appendChild(banStyle);

        var banOverlay = document.createElement('div');
        banOverlay.id = 'banScreenOverlay';
        banOverlay.innerHTML = '<svg class="ban-screen-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill="#e11d48" d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2Zm0 2c1.85 0 3.55.607 4.929 1.636L5.636 16.93A7.96 7.96 0 0 1 4 12c0-4.418 3.582-8 8-8Zm0 16c-1.85 0-3.55-.607-4.929-1.636L18.364 7.07A7.96 7.96 0 0 1 20 12c0 4.418-3.582 8-8 8Z"/></svg><p class="ban-screen-title">محظور</p><p class="ban-screen-subtitle">لا يمكنك الدخول إلى الدردشة حتى يتم فك الحظر عنك</p>';
        document.body.appendChild(banOverlay);
        document.body.style.overflow = 'hidden';
        return;
      }
    }
  } catch (e) {}

  // فحص متزامن لحالة الطرد من الكاش، يعمل فورًا قبل رسم أي محتوى — يمنع الوميض
  try {
    var raw = localStorage.getItem('kickGuardState');
    if (raw) {
      var state = JSON.parse(raw);
      var isPermanent = state && state.kickedUntil === 'permanent';
      var isValid = state && state.isKicked && (isPermanent || (typeof state.kickedUntil === 'number' && state.kickedUntil > Date.now()));
      if (isValid) {
        document.documentElement.style.overflow = 'hidden';

        var style = document.createElement('style');
        style.id = 'kick-screen-style';
        style.textContent = '#kickScreenOverlay{position:fixed;inset:0;background:#000;z-index:2147483647;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;}#kickScreenOverlay .kick-screen-icon{width:96px;height:96px;margin-bottom:24px;}#kickScreenOverlay .kick-screen-title{color:#fff;font-size:28px;font-weight:700;margin:0 0 14px;font-family:inherit;}#kickScreenOverlay .kick-screen-remaining{color:#9ca3af;font-size:16px;margin:0;font-family:inherit;direction:rtl;}';
        document.head.appendChild(style);

        var overlay = document.createElement('div');
        overlay.id = 'kickScreenOverlay';
        overlay.innerHTML = '<svg class="kick-screen-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill="#e11d48" d="M5 20q-.825 0-1.412-.587Q3 18.825 3 18V8q0-.825.588-1.413Q4.175 6 5 6h14q.825 0 1.413.587Q21 7.175 21 8v10q0 .825-.587 1.413Q19.825 20 19 20Zm7-7Zm-1-4q-.425 0-.712.288Q10 9.575 10 10v4q0 .425.288.712.287.288.712.288.425 0 .713-.288Q12 14.425 12 14v-4q0-.425-.287-.712Q11.425 9 11 9Zm0 0h2v4h-2Zm-5 7h14V8H5Zm2-9h10V8H7Z"/></svg><p class="kick-screen-title">تم طردك</p><p class="kick-screen-remaining" id="kickRemainingText">' + (isPermanent ? 'الطرد دائم' : 'جارٍ التحقق...') + '</p>';
        document.body.appendChild(overlay);
        document.body.style.overflow = 'hidden';
      }
    }
  } catch (e) {}
})();
  </script>
  <!-- تأجيل تحميل Algolia (defer) حتى لا يوقف عرض الصفحة -->
  <script defer src="https://cdn.jsdelivr.net/npm/algoliasearch@4/dist/algoliasearch-lite.umd.js"></script>

  <script>
  if (!localStorage.getItem('chatUserId')) {
    window.location.href = 'index.html';
  }
  if (!new URLSearchParams(window.location.search).get('roomId') && !localStorage.getItem('lastVisitedRoomId')) {
    window.location.href = 'rooms.html';
  }
</script>
  <script>
  // ✨ نقرأ فقط الصلاحيات الجاهزة (chatUserPermissions) اللي تم حسابها مرة واحدة
  // عند الدخول من صفحة التسجيل (script.js) — ما فيه أي فحص رتبة هنا، فقط قراءة
  // حتى تظهر الأزرار من أول رسم للصفحة بدون أي وميض.
  try {
    var chatPerms = JSON.parse(localStorage.getItem('chatUserPermissions') || '{}');
    document.documentElement.dataset.canPrivate = chatPerms.canSeePrivateChatButton ? '1' : '0';
    document.documentElement.dataset.canReport = chatPerms.canSeeReportButton ? '1' : '0';
  } catch (e) {
    document.documentElement.dataset.canPrivate = '0';
    document.documentElement.dataset.canReport = '0';
  }
</script>
